name: Beta Build

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    env:
      CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
      CF_R2_KEY_ID: ${{ secrets.CF_R2_KEY_ID }}
      CF_R2_KEY_ACCESS: ${{ secrets.CF_R2_KEY_ACCESS }}
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: '8.3'
      - name: Install dependencies
        run: |
          composer install -q --no-dev --optimize-autoloader --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm i

      - name: Build
        run: npm run build

      - name: Create release branch and bump version
        run: sed -i "s/    'version' => 'development',/    'version' => 'beta',/" config/app.php

      - name: Add commit sha to app.php
        run: sed -i "s/    'commit' => '',/    'commit' => '${{ github.sha }}',/" config/app.php

      - name: Create beta archive
        run: | 
            rm -rf node_modules tests CODE_OF_CONDUCT.md CONTRIBUTING.md flake.lock flake.nix phpstan.neon phpunit.xml shell.nix
            tar -czf paymenter.tar.gz * .env.example .gitignore
    
      - name: Move file to seperate directory for r2 upload
        run: |
          mkdir -p r2_upload
          cp paymenter.tar.gz r2_upload/

      # Upload artifact
      - name: Upload archive to R2
        if: env.CF_R2_ACCOUNT_ID != '' && env.CF_R2_KEY_ID != '' && env.CF_R2_KEY_ACCESS != ''
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ env.CF_R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ env.CF_R2_KEY_ID }}
          r2-secret-access-key: ${{ env.CF_R2_KEY_ACCESS }}
          r2-bucket: paymenter-api
          source-dir: r2_upload
          destination-dir: ./

      - name: Upload archive artifact
        if: env.CF_R2_ACCOUNT_ID == '' || env.CF_R2_KEY_ID == '' || env.CF_R2_KEY_ACCESS == ''
        uses: actions/upload-artifact@v4
        with:
          name: paymenter-beta
          path: r2_upload/paymenter.tar.gz
